---
# =============================================================================
# configure_worker_vlan — Main entry point
# =============================================================================
# Configures VLAN-tagged interfaces and static routes on Kubernetes worker
# nodes so that Telemetry pods can reach BMC endpoints in separate subnets.
#
# Steps:
#   1. Load cluster inventory and resolve worker node list
#   2. Auto-discover BMC subnets (if not provided)
#   3. For each worker: configure VLAN interface, add routes, verify
# =============================================================================

# Step 1: Load cluster inventory
- name: Load cluster inventory
  ansible.builtin.include_vars:
    file: "{{ vlan_cluster_inventory_path }}"
    name: _cluster_inv

- name: Extract worker node IPs from cluster inventory
  ansible.builtin.set_fact:
    _worker_node_ips: >-
      {{
        (_cluster_inv.all.children.service_kube_node_x86_64.hosts | default({}))
        | dict2items
        | map(attribute='value')
        | map(attribute='ansible_host')
        | list
      }}

- name: Fail if no worker nodes found in cluster inventory
  ansible.builtin.fail:
    msg: >-
      No worker nodes (service_kube_node_x86_64) found in cluster inventory
      at '{{ vlan_cluster_inventory_path }}'.
  when: _worker_node_ips | length == 0

- name: Display discovered worker nodes
  ansible.builtin.debug:
    msg: "Worker nodes from inventory: {{ _worker_node_ips | join(', ') }}"

# Step 2: Auto-discover BMC subnets if not provided
- name: Auto-discover BMC subnets from bmc_group_data.csv
  ansible.builtin.include_tasks: discover_bmc_subnets.yml
  when: worker_vlan_config.bmc_subnets | default([]) | length == 0

- name: Use manually specified BMC subnets
  ansible.builtin.set_fact:
    _resolved_bmc_subnets: "{{ worker_vlan_config.bmc_subnets }}"
  when: worker_vlan_config.bmc_subnets | default([]) | length > 0

- name: Fail if no BMC subnets resolved
  ansible.builtin.fail:
    msg: "{{ no_bmc_subnets_msg }}"
  when: _resolved_bmc_subnets | default([]) | length == 0

- name: Display BMC subnets to configure
  ansible.builtin.debug:
    msg: "BMC subnets for static routes: {{ _resolved_bmc_subnets | join(', ') }}"

# Step 3: Set common VLAN parameters
- name: Set VLAN configuration parameters
  ansible.builtin.set_fact:
    _vlan_id: "{{ worker_vlan_config.vlan_id }}"
    _vlan_netmask: "{{ worker_vlan_config.vlan_netmask }}"
    _vlan_gateway: "{{ worker_vlan_config.vlan_gateway }}"
    _route_metric: "{{ worker_vlan_config.route_metric | default(50) }}"
    _parent_interface_override: "{{ worker_vlan_config.parent_interface | default('') }}"

# Step 4: Configure each worker node
- name: Initialize VLAN configuration results
  ansible.builtin.set_fact:
    _vlan_results:
      configured: []
      skipped: []
      failed: []

- name: Configure VLAN on each worker node
  ansible.builtin.include_tasks: configure_worker.yml
  loop: "{{ worker_vlan_config.worker_vlan_assignments }}"
  loop_control:
    loop_var: _worker_assignment
    label: "worker {{ _worker_assignment.worker_host }}"

# Step 5: Display summary
- name: Display VLAN configuration summary
  ansible.builtin.debug:
    msg:
      - "============================================================"
      - "Worker Node VLAN Configuration Summary"
      - "============================================================"
      - "  VLAN ID       : {{ _vlan_id }}"
      - "  Gateway       : {{ _vlan_gateway }}"
      - "  BMC subnets   : {{ _resolved_bmc_subnets | join(', ') }}"
      - "  Route metric  : {{ _route_metric }}"
      - "------------------------------------------------------------"
      - "  Configured    : {{ _vlan_results.configured | length }} worker(s)"
      - "  Skipped       : {{ _vlan_results.skipped | length }} worker(s)"
      - "  Failed        : {{ _vlan_results.failed | length }} worker(s)"
      - "============================================================"
      - "{% if _vlan_results.configured | length > 0 %}  Configured: {{ _vlan_results.configured | join(', ') }}{% endif %}"
      - "{% if _vlan_results.skipped | length > 0 %}  Skipped: {{ _vlan_results.skipped | join(', ') }}{% endif %}"
      - "{% if _vlan_results.failed | length > 0 %}  Failed: {{ _vlan_results.failed | join(', ') }}{% endif %}"

- name: Warn if any workers failed
  ansible.builtin.debug:
    msg: >-
      WARNING: VLAN configuration failed on {{ _vlan_results.failed | length }}
      worker node(s): {{ _vlan_results.failed | join(', ') }}.
      Review the errors above and retry after fixing the issues.
  when: _vlan_results.failed | length > 0
