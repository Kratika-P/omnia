---
# =============================================================================
# discover_bmc_subnets.yml — Auto-discover BMC subnets from bmc_group_data.csv
# =============================================================================
# Reads the BMC_IP column from the Orchestrator-generated CSV and derives
# unique CIDR subnets using the configured vlan_netmask prefix length.
#
# WARNING: This uses Python's ipaddress module to compute the network address.
# The result depends on the vlan_netmask provided. If the site uses
# non-standard subnetting, users should specify bmc_subnets manually.

- name: Read BMC IPs from bmc_group_data.csv
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      awk -F, 'NR > 1 {
        gsub(/^[ \t]+|[ \t]+$/, "", $1)
        if ($1 != "") print $1
      }' "{{ vlan_bmc_group_data_path }}" | sort -u
  args:
    executable: /bin/bash
  register: _bmc_ips_raw
  changed_when: false

- name: Set BMC IP list
  ansible.builtin.set_fact:
    _bmc_ip_list: "{{ _bmc_ips_raw.stdout_lines | select('match', '^[0-9]') | list }}"

- name: Display discovered BMC IPs
  ansible.builtin.debug:
    msg: "BMC IPs from bmc_group_data.csv: {{ _bmc_ip_list | join(', ') }}"

- name: Derive unique BMC subnets from IPs and netmask
  ansible.builtin.shell:
    cmd: |
      python3 -c "
      import ipaddress, sys
      netmask = int(sys.argv[1])
      ips = sys.argv[2:]
      subnets = set()
      for ip_str in ips:
          try:
              net = ipaddress.ip_network(f'{ip_str}/{netmask}', strict=False)
              subnets.add(str(net))
          except ValueError:
              pass
      for s in sorted(subnets):
          print(s)
      " "{{ worker_vlan_config.vlan_netmask }}" {{ _bmc_ip_list | join(' ') }}
  args:
    executable: /bin/bash
  register: _bmc_subnets_raw
  changed_when: false
  when: _bmc_ip_list | length > 0

- name: Set resolved BMC subnets
  ansible.builtin.set_fact:
    _resolved_bmc_subnets: "{{ _bmc_subnets_raw.stdout_lines | default([]) }}"

- name: Display auto-discovered BMC subnets
  ansible.builtin.debug:
    msg: "Auto-discovered BMC subnets: {{ _resolved_bmc_subnets | join(', ') }}"
